yam_hardware_interface:
  ros__parameters:
    # CAN configuration
    can_channel: "can0"

    # Gripper configuration
    # Options: crank_4310, linear_3507, linear_4310, yam_teaching_handle, no_gripper
    gripper_type: "linear_4310"

    # Control loop frequency (Hz)
    # Default: 250Hz matches i2rt native control frequency
    control_frequency: 250.0

    # Hold the current arm position when streamed joint commands stop arriving.
    joint_command_timeout: 0.2

    # FollowJointTrajectory has priority over Cartesian Servo. Keep ignoring
    # residual Servo commands briefly after a trajectory finishes so the old
    # Cartesian target has time to expire.
    trajectory_servo_lockout: 0.35

    # Integrate Servo joint velocities in the hardware control loop (normally
    # about 250 Hz), while the command callback only stores the newest qdot.
    # OMPL /joint_command remains an unmodified absolute position command.
    servo_integration_gain: 1.0
    # Optional qdot slew limiter in rad/s^2. Zero keeps it disabled so this
    # setting matches the previously tested 250 Hz integration behavior.
    servo_max_joint_acceleration: 0.0

    # The SDK supplies a host-side feedback snapshot timestamp (not a motor or
    # CAN hardware timestamp). Reuse it for /joint_states and therefore TF,
    # instead of stamping repeated samples with every 250 Hz ROS publication.
    use_feedback_timestamp: true
    # Gravity compensation
    gravity_comp_enabled: true
    gravity_comp_factor: 1.3  # Multiplier for gravity torque (default: 1.3)

    # Zero gravity mode (free-floating)
    # WARNING: Only use with motor timeout disabled
    zero_gravity_mode: false

    # Robot naming
    robot_name: "yam"

    # TF publishing
    publish_tf: true
