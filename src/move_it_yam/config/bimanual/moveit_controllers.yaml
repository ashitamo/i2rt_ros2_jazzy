moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - yam_follower/left_yam_arm_controller
    - yam_follower/left_gripper_controller
    - yam_follower/right_yam_arm_controller
    - yam_follower/right_gripper_controller

  yam_follower/left_yam_arm_controller:
    type: FollowJointTrajectory
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    action_ns: follow_joint_trajectory
    default: true

  yam_follower/left_gripper_controller:
    type: GripperCommand
    joints:
      - left_joint7
    action_ns: gripper_cmd
    default: true

  yam_follower/right_yam_arm_controller:
    type: FollowJointTrajectory
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    action_ns: follow_joint_trajectory
    default: true

  yam_follower/right_gripper_controller:
    type: GripperCommand
    joints:
      - right_joint7
    action_ns: gripper_cmd
    default: true
trajectory_execution:
  allowed_start_tolerance: 0.2