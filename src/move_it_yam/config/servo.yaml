###############################################
# Shared MoveIt Servo settings for one YAM arm
###############################################

use_gazebo: false

## Incoming Cartesian velocity commands
command_in_type: "speed_units"
scale:
  linear: 0.15
  rotational: 0.5
  joint: 0.5

## Outgoing commands to the YAM hardware interface
publish_period: 0.01
low_latency_mode: true
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
# smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

# move_group is the primary planning scene monitor in demo_bimanual.launch.py.
is_primary_planning_scene_monitor: false

## These values are overridden for the left and right arms by the launch file.
move_group_name: left_yam_arm
planning_frame: left_base
ee_frame_name: left_gripper
robot_link_command_frame: left_base

## Stop when the pose tracker stops publishing.
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Singularity and joint-limit handling
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0

## Servo input/output topics
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /yam_left/joint_command

## Collision checking
check_collisions: true
collision_check_rate: 20.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
